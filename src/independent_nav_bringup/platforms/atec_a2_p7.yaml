platform:
  name: atec_a2_p7
  base_model: unitree_a2
  manipulator: p7
  lidar:
    count: 1
    frame: front_lidar_sensor_link
    pointcloud_topic: /lidar/points
    scan_topic: /scan
  adapter_package: TODO_atec_a2_velocity_adapter
  command_topic: /platform/cmd_vel
  ready_topic: /platform/ready
  manual_override_topic: /platform/manual_override
  max_linear_x: 0.15
  max_angular_z: 0.25
  footprint_radius_m: 0.60
  motion_model_note: >-
    DiffDrive is a planar navigation proxy only; it is not an A2 gait or
    hardware controller.
  terrain:
    gait_controller_verified: false
    safe_for_real_robot: false
    supported_modes: [flat_navigation]
    proxy_probe_modes: [ramp_up, ramp_down, stairs_up]
    note: >-
      Ramp and stair probes measure the rigid planar proxy only. They must not
      be reported as A2 locomotion capability or used to tune a real robot.
  adapter_verified: false
