controller_manager:
  ros__parameters:
    # controller_manager 每秒更新控制器的次数。频率越高，控制越细，但更耗 CPU。
    update_rate: 100

    # 生成 robot 后由 launch 文件依次加载这两个控制器。
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    # 左右轮关节名必须和 Xacro 中生成的 joint name 完全一致。
    # 这里每侧两个轮子，所以使用四轮差速；控制器会把同侧轮子当成一组。
    left_wheel_names:
      - fishbot_front_left_wheel_joint
      - fishbot_rear_left_wheel_joint
    right_wheel_names:
      - fishbot_front_right_wheel_joint
      - fishbot_rear_right_wheel_joint
    # 左右轮中心线之间的距离，单位米。它会影响转弯半径和角速度计算。
    wheel_separation: 0.48
    # 轮半径必须和模型一致，否则里程计会偏大或偏小。
    wheel_radius: 0.10
    wheels_per_side: 2
    # multiplier 用于实际机器人校准；仿真中通常保持 1.0。
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    # 控制器发布里程计的频率。
    publish_rate: 50.0
    # base_frame_id 是机器人本体坐标系；odom_frame_id 是局部里程计坐标系。
    base_frame_id: fishbot_base_link
    odom_frame_id: fishbot/odom
    # true 表示控制器发布 odom -> base_link 的 TF。
    enable_odom_tf: true
    # true 表示根据 Gazebo 返回的关节位置计算里程计；false 通常表示开环估计。
    position_feedback: true
    open_loop: false
    # 超过 0.5 秒没有新速度命令，就自动停车。
    cmd_vel_timeout: 0.5
    linear:
      x:
        has_velocity_limits: true
        # 限制前进和倒车速度，避免导航控制器给出过大的速度。
        max_velocity: 0.7
        min_velocity: -0.4
    angular:
      z:
        has_velocity_limits: true
        # 限制原地旋转角速度。
        max_velocity: 1.8
        min_velocity: -1.8
