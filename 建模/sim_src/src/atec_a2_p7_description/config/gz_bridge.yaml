# /sim/cmd_vel targets VelocityControl's canonical-link command topic; this is
# a planar simulation proxy, not a real A2 motion-controller endpoint.
# The Gazebo GPU lidar reports its sensor-scoped entity name by default.
# Inject the canonical simulation sensor frame into the ROS PointCloud2 header
# so downstream TF consumers use the fixed transform in the robot description.
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/model/atec_a2_p7/link/base_link/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar/points"
  gz_topic_name: "/lidar/points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  frame_id: "front_lidar_sensor_link"

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
